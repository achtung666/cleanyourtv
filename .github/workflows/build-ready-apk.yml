name: Build ready CleanYourTV APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'launcher/**'
      - '.github/workflows/build-ready-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        working-directory: launcher
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-ready-APK
          path: launcher/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
